<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Carros</title>

<style>

body{
    margin:0;
    padding:30px;
    background:#eff6ff;
    font-family:Arial;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0px 5px 20px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#1e3a8a;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    border-radius:10px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:30px;
}

th{
    background:#2563eb;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

tr:hover{
    background:#f3f4f6;
}

a{
    background:#dc2626;
    color:white;
    padding:8px 12px;
    border-radius:8px;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>🚗 Cadastro de Carros</h1>

<form method="POST">

<input
type="text"
name="modelo"
placeholder="Modelo do carro"
required>

<input
type="text"
name="marca"
placeholder="Marca"
required>

<input
type="text"
name="ano"
placeholder="Ano"
required>

<button type="submit">
Cadastrar Carro
</button>

</form>

<h2>🚘 Carros Cadastrados</h2>

<table>

<tr>
    <th>ID</th>
    <th>Modelo</th>
    <th>Marca</th>
    <th>Ano</th>
    <th>Ações</th>
</tr>

{% for carro in carros %}

<tr>

<td>{{ carro[0] }}</td>
<td>{{ carro[1] }}</td>
<td>{{ carro[2] }}</td>
<td>{{ carro[3] }}</td>

<td>
    <a href="/excluir_carro/{{ carro[0] }}">
        ❌ Excluir
    </a>
</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
