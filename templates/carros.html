<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carros</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    margin:0;
    padding:0;
}

.topo{
    background:#2563eb;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:700px;
    margin:auto;
    margin-top:30px;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    border-radius:10px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.carro{
    background:#eef2ff;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
}

.menu{
    margin-top:20px;
    text-align:center;
}

.menu a{
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:10px 20px;
    border-radius:10px;
    margin:5px;
    display:inline-block;
}

.menu a:hover{
    background:#1d4ed8;
}

/* 🔎 BUSCA */
.busca{
    margin-bottom:20px;
}

.busca input{
    width:70%;
    display:inline-block;
}

.busca button{
    width:28%;
    display:inline-block;
    padding:12px;
    font-size:16px;
}

</style>

</head>

<body>

<div class="topo">

<h1>🚗 Cadastro de Carros</h1>

</div>

<div class="container">

<div class="card">

<h2>Cadastrar Carro</h2>

<form method="POST">

<input type="text" name="modelo" placeholder="Modelo" required>

<input type="text" name="marca" placeholder="Marca" required>

<input type="text" name="ano" placeholder="Ano" required>

<button type="submit">Cadastrar Carro</button>

</form>

</div>

<div class="card" style="margin-top:30px;">

<h2>📋 Carros Cadastrados</h2>

<!-- 🔎 BUSCA -->
<form method="GET" class="busca">
    <input type="text" name="busca" placeholder="Buscar carro...">
    <button type="submit">Buscar</button>
</form>

{% for carro in carros %}

<div class="carro">

    <p><strong>Modelo:</strong> {{ carro[1] }}</p>
    <p><strong>Marca:</strong> {{ carro[2] }}</p>
    <p><strong>Ano:</strong> {{ carro[3] }}</p>

    <!-- 🗑️ EXCLUIR CARRO -->
    <a href="/excluir_carro/{{ carro[0] }}"
       style="background:red;color:white;padding:8px 12px;
       border-radius:8px;text-decoration:none;display:inline-block;margin-top:10px;">
       🗑️ Excluir
    </a>

</div>

{% endfor %}

</div>

<div class="menu">

<a href="/">Clientes</a>
<a href="/alugueis">Aluguéis</a>
<a href="/logout">Sair</a>

</div>

</div>

</body>

</html>
