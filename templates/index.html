<!DOCTYPE html>
<html>

<head>

    <title>Clientes</title>

    <style>

        body{
            font-family: Arial;
            background: #f4f4f4;
            padding: 20px;
        }

        .caixa{
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        h1{
            color: #333;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background: #0056b3;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td{
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th{
            background: #222;
            color: white;
        }

        .menu{
            margin-bottom: 20px;
        }

        .menu a{
            text-decoration: none;
            background: #007bff;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-right: 10px;
        }

        .menu a:hover{
            background: #0056b3;
        }

        .excluir{
            color: red;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="menu">

        <a href="/">Clientes</a>

        <a href="/carros">
            Carros
        </a>

        <a href="/alugueis">
            Aluguéis
        </a>

        <a href="/financeiro">
            Financeiro
        </a>

        <a href="/logout">
            Sair
        </a>

    </div>

    <div class="caixa">

        <h1>Cadastro de Clientes</h1>

        <!-- BUSCA -->

        <form method="GET">

            <input
            type="text"
            name="busca"
            placeholder="Buscar cliente"
            >

            <button type="submit">
                Buscar
            </button>

        </form>

        <br>

        <!-- CADASTRO -->

        <form method="POST">

            <input
            type="text"
            name="nome"
            placeholder="Nome do cliente"
            required
            >

            <input
            type="text"
            name="telefone"
            placeholder="Telefone"
            required
            >

            <button type="submit">
                Salvar Cliente
            </button>

        </form>

    </div>

    <table>

        <tr>

            <th>ID</th>
            <th>Nome</th>
            <th>Telefone</th>
            <th>Ações</th>

        </tr>

        {% for cliente in clientes %}

        <tr>

            <td>{{ cliente[0] }}</td>

            <td>{{ cliente[1] }}</td>

            <td>{{ cliente[2] }}</td>

            <td>

                <a
                class="excluir"
                href="/excluir/{{ cliente[0] }}"
                >

                    Excluir

                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</body>

</html>
