<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Clientes</title>

<style>

body{
    margin:0;
    padding:30px;
    background:#eff6ff;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0px 5px 20px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#1e3a8a;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:30px;
}

th{
    background:#2563eb;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

tr:hover{
    background:#f3f4f6;
}

h2{
    margin-top:40px;
    color:#1e3a8a;
}

a{
    background:#dc2626;
    color:white;
    padding:8px 12px;
    border-radius:8px;
    text-decoration:none;
}

a:hover{
    background:#b91c1c;
}

</style>

</head>

<body>

<div class="container">

<h1>👥 Cadastro de Clientes</h1>

<form method="POST">

<input
type="text"
name="nome"
placeholder="Digite o nome"
required>

<input
type="text"
name="telefone"
placeholder="Digite o telefone"
required>

<button type="submit">
Cadastrar Cliente
</button>

</form>

<h2>📋 Clientes Cadastrados</h2>

<table>

<tr>
    <th>ID</th>
    <th>Nome</th>
    <th>Telefone</th>
    <th>Ações</th>
</tr>

{% for cliente in clientes %}

<tr>
    <td>{{ cliente[0] }}</td>
    <td>{{ cliente[1] }}</td>
    <td>{{ cliente[2] }}</td>

    <td>
        <a href="/excluir/{{ cliente[0] }}">
            ❌ Excluir
        </a>
    </td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
