<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Locadora de Carros</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    margin:0;
    padding:0;
}

.topo{
    background:#2563eb;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:700px;
    margin:auto;
    margin-top:30px;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    border-radius:10px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.cliente{
    background:#eef2ff;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
}

.menu{
    margin-top:30px;
    text-align:center;
}

.menu a{
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:10px 20px;
    border-radius:10px;
    margin:5px;
    display:inline-block;
}

.menu a:hover{
    background:#1d4ed8;
}

/* 🟢 ESTILO DA BUSCA */
.busca{
    margin-bottom:20px;
}

.busca input{
    width:70%;
    display:inline-block;
}

.busca button{
    width:28%;
    display:inline-block;
    padding:12px;
    font-size:16px;
}

</style>

</head>

<body>

<div class="topo">
    <h1>🚗 Sistema de Locadora</h1>
</div>

<div class="container">

    <div class="card">

        <h2>Cadastrar Cliente</h2>

        <form method="POST">

            <input type="text" name="nome" placeholder="Nome do cliente" required>

            <input type="text" name="telefone" placeholder="Telefone" required>

            <button type="submit">Cadastrar Cliente</button>

        </form>

    </div>

    <div class="card" style="margin-top:30px;">

        <h2>📋 Clientes Cadastrados</h2>
        

        <!-- 🔎 BUSCA ADICIONADA -->
        <form method="GET" class="busca">
            <input type="text" name="busca" placeholder="Buscar cliente...">
            <button type="submit">Buscar</button>
        </form>

        {% for cliente in clientes %}

        <div class="cliente">

            <p><strong>Nome:</strong> {{ cliente[1] }}</p>

            <p><strong>Telefone:</strong> {{ cliente[2] }}</p>

        </div>

        {% endfor %}

    </div>

    <div class="menu">

        <a href="/">Clientes</a>
        <a href="/carros">Carros</a>
        <a href="/alugueis">Aluguéis</a>
        <a href="/financeiro">Financeiro</a>
        <a href="/pagamento">💰 Pagar Projeto</a>
        <a href="/logout">Sair</a>

    </div>

</div>

</body>

</html>
