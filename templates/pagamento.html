<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Pagamento</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      padding: 30px;
      width: 320px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .titulo {
      font-size: 22px;
      margin-bottom: 10px;
      color: #111827;
    }

    .valor {
      font-size: 28px;
      font-weight: bold;
      color: #2563eb;
      margin: 15px 0;
    }

    .descricao {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 20px;
    }

    .btn-whatsapp {
      display: inline-block;
      background: #25D366;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-whatsapp:hover {
      background: #1ebe5d;
      transform: scale(1.05);
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="titulo">Pagamento do Projeto</div>

    <div class="descricao">
      Sistema de Locadora de Carros
    </div>

    <div class="valor">R$ {{ valor }}</div>

    <a class="btn-whatsapp"
       href="https://wa.me/5531972150654?text=Olá! Quero pagar o projeto de sistema de locadora no valor de R$ {{ valor }}"
       target="_blank">
      Pagar via WhatsApp
    </a>

    <div class="footer">
      Atendimento rápido via WhatsApp
    </div>

  </div>

</body>
</html>
