<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Login</title>

<style>

body{
    background:#2563eb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}

.box{
    background:white;
    padding:40px;
    border-radius:20px;
    width:350px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    border-radius:10px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:12px;
    font-size:18px;
}

h1{
    text-align:center;
}

</style>

</head>

<body>

<div class="box">

<h1>🔐 Login</h1>

<form method="POST">

<input
type="text"
name="usuario"
placeholder="Usuário">

<input
type="password"
name="senha"
placeholder="Senha">

<button type="submit">
Entrar
</button>

</form>

</div>

</body>

</html>
