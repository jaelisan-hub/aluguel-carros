<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aluguéis</title>

<style>

body{
    margin:0;
    padding:30px;
    background:#eff6ff;
    font-family:Arial;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0px 5px 20px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#1e3a8a;
}

select,input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    border-radius:10px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:30px;
}

th{
    background:#2563eb;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

a{
    background:#dc2626;
    color:white;
    padding:8px 12px;
    border-radius:8px;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>📋 Aluguéis</h1>

<form method="POST">

<select name="cliente" required>

<option value="">
Selecione o cliente
</option>

{% for cliente in clientes %}

<option value="{{ cliente[0] }}">
{{ cliente[0] }}
</option>

{% endfor %}

</select>

<select name="carro" required>

<option value="">
Selecione o carro
</option>

{% for carro in carros %}

<option value="{{ carro[0] }}">
{{ carro[0] }}
</option>

{% endfor %}

</select>

<input
type="number"
name="dias"
placeholder="Quantidade de dias"
required>

<button type="submit">
Cadastrar Aluguel
</button>

</form>

<h2>🚗 Aluguéis Cadastrados</h2>

<table>

<tr>
    <th>ID</th>
    <th>Cliente</th>
    <th>Carro</th>
    <th>Dias</th>
    <th>Ações</th>
</tr>

{% for aluguel in alugueis %}

<tr>

<td>{{ aluguel[0] }}</td>
<td>{{ aluguel[1] }}</td>
<td>{{ aluguel[2] }}</td>
<td>{{ aluguel[3] }}</td>

<td>
<a href="/excluir_aluguel/{{ aluguel[0] }}">
❌ Excluir
</a>
</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
