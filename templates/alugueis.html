<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aluguéis</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    margin:0;
    padding:0;
}

.topo{
    background:#2563eb;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:800px;
    margin:auto;
    margin-top:30px;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

select,input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    border-radius:10px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.aluguel{
    background:#eef2ff;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
}

.menu{
    text-align:center;
    margin-top:30px;
}

.menu a{
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:10px 20px;
    border-radius:10px;
    margin:5px;
    display:inline-block;
}

.menu a:hover{
    background:#1d4ed8;
}

/* 🔎 BUSCA */
.busca{
    margin-bottom:20px;
}

.busca input{
    width:70%;
    display:inline-block;
}

.busca button{
    width:28%;
    display:inline-block;
    padding:12px;
    font-size:16px;
}

</style>

</head>

<body>

<div class="topo">

<h1>📅 Sistema de Aluguéis</h1>

</div>

<div class="container">

<div class="card">

<h2>Novo Aluguel</h2>

<form method="POST">

<input type="text" name="cliente" placeholder="Digite o nome do cliente" required>

<input type="text" name="carro" placeholder="Digite o carro" required>

<input type="number" name="dias" placeholder="Quantidade de dias" required>

<input type="number" step="0.01" name="diaria" placeholder="Valor da diária" required>

<button type="submit">Registrar Aluguel</button>

</form>

</div>

<div class="card" style="margin-top:30px;">

<h2>📋 Aluguéis Registrados</h2>

<!-- 🔎 BUSCA -->
<form method="GET" class="busca">
    <input type="text" name="busca" placeholder="Buscar aluguel por cliente...">
    <button type="submit">Buscar</button>
</form>

{% for aluguel in alugueis %}

<div class="aluguel">

    <p><strong>Cliente:</strong> {{ aluguel[1] }}</p>
    <p><strong>Carro:</strong> {{ aluguel[2] }}</p>
    <p><strong>Dias:</strong> {{ aluguel[3] }}</p>
    <p><strong>Diária:</strong> R$ {{ aluguel[4] }}</p>
    <p><strong>Total:</strong> R$ {{ aluguel[5] }}</p>

    <!-- 🗑️ EXCLUIR ALUGUEL -->
    <a href="/excluir_aluguel/{{ aluguel[0] }}"
       style="background:red;color:white;padding:8px 12px;
       border-radius:8px;text-decoration:none;display:inline-block;margin-top:10px;">
       🗑️ Excluir
    </a>

</div>

{% endfor %}

</div>

<div class="menu">

<a href="/">Clientes</a>
<a href="/carros">Carros</a>
<a href="/logout">Sair</a>

</div>

</div>

</body>

</html>
